; Initial PlatformIO environment for Freenove FNK0104B.
; The FNK0104B 2.8-inch capacitive-touch board is not the generic
; Freenove ESP32-S3-WROOM N8R8 board profile. A custom board manifest
; will be added after validating flash/PSRAM configuration from Freenove.
;
; This project intentionally does not force flash mode, PSRAM mode,
; memory partition, or optimization flags until the module config is confirmed.

[env:freenove_fnk0104b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Temporary generic ESP32-S3 baseline only.
; NOT YET a validated FNK0104B hardware configuration.
build_flags =
    -DCORE_DEBUG_LEVEL=3
