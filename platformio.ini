; Initial PlatformIO environment.
; The exact Freenove board profile and PSRAM settings are to be verified
; against the user's board revision before this environment is considered build-ready.

[env:freenove_s3]
platform = espressif32
board = freenove_esp32_s3_wroom
framework = arduino

monitor_speed = 115200
upload_speed = 921600

; Do not force QIO/OPI or PSRAM mode until the exact module/board configuration
; is verified. Wrong flash/PSRAM mode settings can prevent boot.
build_flags =
    -DCORE_DEBUG_LEVEL=3
