; Freenove ESP32-S3 Display FNK0104B
; Generic ESP32-S3 board definition; hardware-specific settings below reflect
; the observed 16 MiB flash / 8 MiB OPI PSRAM module.
; Display and touch pin mapping/controller are assumptions pending verification.

[env:freenove_fnk0104b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

monitor_speed = 115200
upload_speed = 460800
; Keep the USB-Serial/JTAG monitor from toggling reset control lines.
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<*>
    -<stockfish/>
    -<stockfish_probe.cpp>

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; SF19 Smallnet + display probe, bounded depth-16 positions, and timed search.
[env:freenove_stockfish_compile]
extends = env:freenove_fnk0104b
extra_scripts = pre:scripts/download_stockfish_nnue.py
build_unflags = -std=gnu++11
build_src_filter =
    +<stockfish_probe.cpp>
    +<stockfish/*.cpp>
    +<stockfish/**/*.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNDEBUG
    -DNO_PREFETCH
    -DNO_TABLEBASES
    -D STOCKFISH_ESP32_S3=1
    -fno-exceptions
    -std=gnu++17
    -I src/stockfish
    -Os
    ; Keep the link map even when ld fails, for DRAM/PSRAM diagnosis.
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
    -Wl,--print-memory-usage

; Performance comparison: identical source/configuration, only -O level differs.
; The Arduino ESP32 release default is -Os; pin it explicitly in the baseline.
[env:freenove_stockfish_o2]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Os
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=2
    -O2
    -Wl,-Map=.pio/build/freenove_stockfish_o2/firmware.map

[env:freenove_stockfish_o3]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Os
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=3
    -O3
    -Wl,-Map=.pio/build/freenove_stockfish_o3/firmware.map

; Dedicated NNUE profiler. It uses the normal -Os baseline, but adds per-layer
; cycle counters to Network::evaluate and NetworkArchitecture::propagate.
[env:freenove_stockfish_nnubench]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=1
    -D STOCKFISH_NNUE_BENCHMARK=1
    -Wl,-Map=.pio/build/freenove_stockfish_nnubench/firmware.map

; Experimental ESP32-S3 PIE accumulator kernel with the NNUE profiler enabled.
; The normal compile and nnubench environments remain on the scalar fallback.
[env:freenove_stockfish_piebench]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=1
    -D STOCKFISH_NNUE_BENCHMARK=1
    -D STOCKFISH_ESP32_S3_PIE=1
    -Wl,-Map=.pio/build/freenove_stockfish_piebench/firmware.map

; Uninstrumented ESP32-S3 PIE accumulator build for real NPS measurements.
; Unlike piebench, this environment keeps NNUE cycle instrumentation disabled.
[env:freenove_stockfish_pie]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=1
    -D STOCKFISH_ESP32_S3_PIE=1
    -Wl,-Map=.pio/build/freenove_stockfish_pie/firmware.map

; Dedicated exact scalar-vs-PIE parity check for every incremental accumulator update.
; It intentionally includes the profiler and reference calculation overhead.
[env:freenove_stockfish_pievalidate]
extends = env:freenove_stockfish_compile
build_unflags =
    -std=gnu++11
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
build_flags =
    ${env:freenove_stockfish_compile.build_flags}
    -D STOCKFISH_OPT_LEVEL=1
    -D STOCKFISH_NNUE_BENCHMARK=1
    -D STOCKFISH_ESP32_S3_PIE=1
    -D STOCKFISH_ESP32_S3_PIE_VALIDATE=1
    -Wl,-Map=.pio/build/freenove_stockfish_pievalidate/firmware.map
