; Freenove ESP32-S3 Display FNK0104B
; Generic ESP32-S3 board definition; hardware-specific settings below reflect
; the observed 16 MiB flash / 8 MiB OPI PSRAM module.
; Display and touch pin mapping/controller are assumptions pending verification.

[env:freenove_fnk0104b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

monitor_speed = 115200
upload_speed = 460800
monitor_dtr = 1
monitor_rts = 1

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<*>
    -<stockfish/>
    -<stockfish_probe.cpp>

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; Compile/link-only SF19 Smallnet target. No search is started.
[env:freenove_stockfish_compile]
extends = env:freenove_fnk0104b
build_unflags = -std=gnu++11
build_src_filter =
    +<stockfish_probe.cpp>
    +<stockfish/>
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNDEBUG
    -DNO_PREFETCH
    -DNO_TABLEBASES
    -DNNUE_EMBEDDING_OFF
    -fno-exceptions
    -std=gnu++17
    -I src/stockfish
