; Freenove ESP32-S3 Display FNK0104B
; Generic ESP32-S3 board definition; hardware-specific settings below reflect
; the observed 16 MiB flash / 8 MiB OPI PSRAM module.
; Display and touch pin mapping/controller are assumptions pending verification.

[env:freenove_fnk0104b]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = dio
board_build.arduino.memory_type = dio_opi
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L

monitor_speed = 115200
upload_speed = 460800
; Keep the USB-Serial/JTAG monitor from toggling reset control lines.
monitor_dtr = 0
monitor_rts = 0

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<*>
    -<stockfish/>
    -<stockfish_probe.cpp>

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

; SF19 Smallnet memory, NNUE verification, and depth-1 search probe.
[env:freenove_stockfish_compile]
extends = env:freenove_fnk0104b
extra_scripts = pre:scripts/download_stockfish_nnue.py
build_unflags = -std=gnu++11
build_src_filter =
    +<stockfish_probe.cpp>
    +<stockfish/*.cpp>
    +<stockfish/**/*.cpp>
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DNDEBUG
    -DNO_PREFETCH
    -DNO_TABLEBASES
    -fno-exceptions
    -std=gnu++17
    -I src/stockfish
    ; Keep the link map even when ld fails, for DRAM/PSRAM diagnosis.
    -Wl,-Map=.pio/build/freenove_stockfish_compile/firmware.map
    -Wl,--print-memory-usage
