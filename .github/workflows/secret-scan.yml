name: Secret scan

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  scan:
    name: Scan all refs and repository files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out all branches and full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: List refs included in the scan
        run: git for-each-ref --format='%(refname)' refs/heads refs/remotes/origin

      - name: Scan full Git history across all refs
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --log-opts="--all HEAD" --redact=100 --exit-code=1

      - name: Scan the checked-out working tree
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --redact=100 --exit-code=1 .
