name: ESP32-S3 Stockfish Smallnet QIO compile

on:
  push:
    branches:
      - main
    paths:
      - "platformio.ini"
      - "partitions_stockfish_16MB.csv"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "platformio.ini"
      - "partitions_stockfish_16MB.csv"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Validate single-app raw-book partition layout
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("partitions_stockfish_16MB.csv")
          rows = {}
          with path.open(newline="") as f:
              for row in csv.reader(line for line in f if not line.lstrip().startswith("#")):
                  if row and row[0].strip():
                      name, typ, subtype, offset, size, *flags = [v.strip() for v in row]
                      rows[name] = (typ, subtype, int(offset, 0), int(size, 0), flags[0] if flags else "")

          assert rows["nvs"][2:4] == (0x9000, 0x5000)
          assert rows["factory"][0:4] == ("app", "factory", 0x10000, 0x400000)
          assert rows["book"][0:4] == ("data", "0x06", 0x410000, 0xBE0000)
          assert rows["book"][4] == "readonly"
          assert rows["coredump"][2:4] == (0xFF0000, 0x10000)
          assert not {"app0", "app1", "otadata", "spiffs"} & rows.keys()
          assert 0x410000 + 0xBE0000 == 0xFF0000
          assert 0xFF0000 + 0x10000 == 0x1000000
          print("Validated: 4 MiB factory app, 11.875 MiB read-only raw book, existing NVS and coredump.")
          PY

      - name: Run native Stockfish GUI rule regression tests
        run: bash tests/native/run_tests.sh

      - name: Compile QIO firmware, profiler and parity validator
        shell: bash
        run: |
          set -euo pipefail
          for env in freenove_stockfish_gui freenove_stockfish_compile freenove_stockfish_o2 freenove_stockfish_o3 freenove_stockfish_core1 freenove_stockfish_nnubench freenove_stockfish_pievalidate; do
            echo "===== Building $env ====="
            log="/tmp/${env}.log"
            if ! pio run -e "$env" -v > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            echo "Effective compile command (first C++ translation unit):"
            command="$(grep -m 1 -E 'xtensa-esp32s3-elf-g\+\+.* -c ' "$log")" || {
              echo "Could not find the C++ compile command in verbose output."
              tail -n 100 "$log"
              exit 1
            }
            echo "$command"
            expected_opt=""
            case "$env" in
              freenove_stockfish_compile) expected_opt="-Os" ;;
              freenove_stockfish_o2) expected_opt="-O2" ;;
              freenove_stockfish_o3) expected_opt="-O3" ;;
            esac
            if [[ -n "$expected_opt" ]]; then
              actual_opt="$(grep -oE -- '-O(s|[0-3])' <<<"$command" | tail -n 1 || true)"
              if [[ "$actual_opt" != "$expected_opt" ]]; then
                echo "Expected final optimization flag $expected_opt in $env, got '$actual_opt'."
                exit 1
              fi
            fi
            if [[ "$env" == "freenove_stockfish_compile" || "$env" == "freenove_stockfish_nnubench" || "$env" == "freenove_stockfish_pievalidate" ]]; then
              grep -q -- '-DSTOCKFISH_ESP32_S3_PIE=1' <<<"$command" || {
                echo "PIE was not enabled in $env."
                exit 1
              }
            fi
            grep -q '/qio_opi/include' <<<"$command" || {
              echo "QIO flash / OPI PSRAM SDK variant was not selected in $env."
              exit 1
            }
            if grep -q '/dio_opi/include' <<<"$command"; then
              echo "DIO flash / OPI PSRAM SDK variant unexpectedly selected in $env."
              exit 1
            fi
            if [[ "$env" == "freenove_stockfish_core1" ]]; then
              grep -q -- '-DSTOCKFISH_SEARCH_CORE=1' <<<"$command" || {
                echo "Core-1 affinity was not enabled in $env."
                exit 1
              }
            fi
            if [[ "$env" == "freenove_stockfish_pievalidate" ]]; then
              grep -q -- '-DSTOCKFISH_ESP32_S3_PIE_VALIDATE=1' <<<"$command" || {
                echo "PIE parity validation was not enabled."
                exit 1
              }
            fi
          done

      - name: Upload default PIE, profiler and validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stockfish-s3-pie-builds
          path: |
            .pio/build/freenove_stockfish_gui/firmware.bin
            .pio/build/freenove_stockfish_gui/firmware.map
            .pio/build/freenove_stockfish_compile/firmware.bin
            .pio/build/freenove_stockfish_compile/firmware.map
            .pio/build/freenove_stockfish_o2/firmware.bin
            .pio/build/freenove_stockfish_o2/firmware.map
            .pio/build/freenove_stockfish_o3/firmware.bin
            .pio/build/freenove_stockfish_o3/firmware.map
            .pio/build/freenove_stockfish_core1/firmware.bin
            .pio/build/freenove_stockfish_core1/firmware.map
            .pio/build/freenove_stockfish_nnubench/firmware.bin
            .pio/build/freenove_stockfish_nnubench/firmware.map
            .pio/build/freenove_stockfish_pievalidate/firmware.bin
            .pio/build/freenove_stockfish_pievalidate/firmware.map
          if-no-files-found: warn
          retention-days: 7

      - name: Prepare A/B/C optimization benchmark package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-abcs
          cp .pio/build/freenove_stockfish_compile/firmware.bin benchmark-abcs/stockfish_A_Os.bin
          cp .pio/build/freenove_stockfish_o2/firmware.bin benchmark-abcs/stockfish_B_O2.bin
          cp .pio/build/freenove_stockfish_o3/firmware.bin benchmark-abcs/stockfish_C_O3.bin
          (cd benchmark-abcs && sha256sum stockfish_*.bin > SHA256SUMS.txt)
          cat > benchmark-abcs/README.txt <<'EOF'
          Stockfish ESP32-S3 compiler optimization A/B/C test
          
          A = -Os (freenove_stockfish_compile)
          B = -O2 (freenove_stockfish_o2)
          C = -O3 (freenove_stockfish_o3)
          
          All three builds use the same source revision, ESP32-S3 FNK0104B board
          configuration, QIO flash / OPI PSRAM, 240 MHz CPU, partition table,
          NNUE network, 1 MiB hash, search probe and test positions. Only the final
          compiler optimization flag differs. The firmware prints its optimization
          level at startup.
          
          Flash only the application image at offset 0x10000. Do not erase flash or
          rewrite the partition table. The existing NVS and book partition are preserved.
          
          Run each firmware from a cold reboot and capture the complete serial output
          at 115200 baud. Compare NPS, depth, nodes, bestmove, internal heap, PSRAM
          and any warnings. For a fair comparison, keep board, USB cable/port, power,
          ambient conditions and run order consistent; alternate A/B/C order between
          repeats to limit temperature and clock drift. One run per build is only a
          screening result; use at least three runs each before deciding.
          
          Example:
          esptool --chip esp32s3 --port COM12 --baud 460800 write-flash 0x10000 .\\stockfish_A_Os.bin
EOF

      - name: Upload A/B/C optimization firmware
        uses: actions/upload-artifact@v7
        with:
          name: stockfish-s3-opt-abcs
          path: benchmark-abcs/*
          if-no-files-found: error
          retention-days: 7
