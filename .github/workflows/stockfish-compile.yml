name: ESP32-S3 Stockfish Smallnet compile

on:
  push:
    branches:
      - stockfish-port-analysis
    paths:
      - "platformio.ini"
      - "src/**"
      - ".github/workflows/stockfish-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile baseline and NNUE profiler
        shell: bash
        run: |
          set -euo pipefail
          for env in freenove_stockfish_compile freenove_stockfish_pie freenove_stockfish_nnubench freenove_stockfish_piebench freenove_stockfish_pievalidate; do
            echo "===== Building $env ====="
            log="/tmp/${env}.log"
            if ! pio run -e "$env" -v > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            echo "Effective compile command (first C++ translation unit):"
            grep -m 1 -E 'xtensa-esp32s3-elf-g\+\+.* -c ' "$log" || {
              echo "Could not find the C++ compile command in verbose output."
              tail -n 100 "$log"
              exit 1
            }
          done

      - name: Upload baseline and profiler artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-s3-nnue-profiler-builds
          path: |
            .pio/build/freenove_stockfish_compile/firmware.bin
            .pio/build/freenove_stockfish_compile/firmware.map
            .pio/build/freenove_stockfish_pie/firmware.bin
            .pio/build/freenove_stockfish_pie/firmware.map
            .pio/build/freenove_stockfish_nnubench/firmware.bin
            .pio/build/freenove_stockfish_nnubench/firmware.map
            .pio/build/freenove_stockfish_piebench/firmware.bin
            .pio/build/freenove_stockfish_piebench/firmware.map
            .pio/build/freenove_stockfish_pievalidate/firmware.bin
            .pio/build/freenove_stockfish_pievalidate/firmware.map
          if-no-files-found: warn
          retention-days: 7
