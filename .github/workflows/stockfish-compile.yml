name: ESP32-S3 Stockfish Smallnet QIO compile

on:
  push:
    branches:
      - main
    paths:
      - "platformio.ini"
      - "partitions_stockfish_16MB.csv"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "platformio.ini"
      - "partitions_stockfish_16MB.csv"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Validate single-app raw-book partition layout
        shell: bash
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("partitions_stockfish_16MB.csv")
          rows = {}
          with path.open(newline="") as f:
              for row in csv.reader(line for line in f if not line.lstrip().startswith("#")):
                  if row and row[0].strip():
                      name, typ, subtype, offset, size, *flags = [v.strip() for v in row]
                      rows[name] = (typ, subtype, int(offset, 0), int(size, 0), flags[0] if flags else "")

          assert rows["nvs"][2:4] == (0x9000, 0x5000)
          assert rows["factory"][0:4] == ("app", "factory", 0x10000, 0x400000)
          assert rows["book"][0:4] == ("data", "0x06", 0x410000, 0xBE0000)
          assert rows["book"][4] == "readonly"
          assert rows["coredump"][2:4] == (0xFF0000, 0x10000)
          assert not {"app0", "app1", "otadata", "spiffs"} & rows.keys()
          assert 0x410000 + 0xBE0000 == 0xFF0000
          assert 0xFF0000 + 0x10000 == 0x1000000
          print("Validated: 4 MiB factory app, 11.875 MiB read-only raw book, existing NVS and coredump.")
          PY

      - name: Run native Stockfish GUI rule regression tests
        run: bash tests/native/run_tests.sh

      - name: Compile QIO firmware, profilers and parity validator
        shell: bash
        run: |
          set -euo pipefail
          for env in freenove_stockfish_gui freenove_stockfish_compile freenove_stockfish_nnubench freenove_stockfish_nnubench_fc0pie freenove_stockfish_pievalidate; do
            echo "===== Building $env ====="
            log="/tmp/${env}.log"
            if ! pio run -e "$env" -v > "$log" 2>&1; then
              cat "$log"
              exit 1
            fi
            echo "Effective compile command (first C++ translation unit):"
            command="$(grep -m 1 -E 'xtensa-esp32s3-elf-g\+\+.* -c ' "$log")" || {
              echo "Could not find the C++ compile command in verbose output."
              tail -n 100 "$log"
              exit 1
            }
            echo "$command"
            actual_opt="$(grep -oE -- '-O(s|[0-3])' <<<"$command" | tail -n 1 || true)"
            if [[ "$actual_opt" != "-O2" ]]; then
              echo "Expected -O2 for every firmware environment in $env, got '$actual_opt'."
              exit 1
            fi
            if [[ "$env" == "freenove_stockfish_compile" || "$env" == "freenove_stockfish_nnubench" || "$env" == "freenove_stockfish_nnubench_fc0pie" || "$env" == "freenove_stockfish_pievalidate" ]]; then
              grep -q -- '-DSTOCKFISH_ESP32_S3_PIE=1' <<<"$command" || {
                echo "PIE was not enabled in $env."
                exit 1
              }
            fi
            grep -q '/qio_opi/include' <<<"$command" || {
              echo "QIO flash / OPI PSRAM SDK variant was not selected in $env."
              exit 1
            }
            if grep -q '/dio_opi/include' <<<"$command"; then
              echo "DIO flash / OPI PSRAM SDK variant unexpectedly selected in $env."
              exit 1
            fi
            if [[ "$env" == "freenove_stockfish_nnubench_fc0pie" || "$env" == "freenove_stockfish_pievalidate" ]]; then
              grep -q -- '-DSTOCKFISH_ESP32_S3_FC0_PIE=1' <<<"$command" || {
                echo "The experimental FC0 PIE kernel was not enabled in $env."
                exit 1
              }
            fi
            if [[ "$env" == "freenove_stockfish_pievalidate" ]]; then
              grep -q -- '-DSTOCKFISH_ESP32_S3_PIE_VALIDATE=1' <<<"$command" || {
                echo "Accumulator PIE parity validation was not enabled."
                exit 1
              }
              grep -q -- '-DSTOCKFISH_ESP32_S3_FC0_PIE_VALIDATE=1' <<<"$command" || {
                echo "FC0 scalar parity validation was not enabled."
                exit 1
              }
            fi
          done


      - name: Disassemble FC0 PIE profiler
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          elf=".pio/build/freenove_stockfish_nnubench_fc0pie/firmware.elf"
          objdump="$(find "$HOME/.platformio/packages" -path '*/bin/xtensa-esp32s3-elf-objdump' -type f -print -quit)"
          if [[ -z "$objdump" ]]; then
            echo "Could not locate xtensa-esp32s3-elf-objdump."
            exit 1
          fi
          "$objdump" -d -C "$elf" > .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.disasm
          echo "FC0 PIE instruction matches:"
          grep -n -i -E 'vmulas\.s8\.qacc|vldbc\.8|vld\.128\.ip|rur\.qacc_[lh]_[04]' .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.disasm | head -n 60 || true

      - name: Upload default PIE, scalar/PIE profilers and validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stockfish-s3-pie-builds
          path: |
            .pio/build/freenove_stockfish_gui/firmware.bin
            .pio/build/freenove_stockfish_gui/firmware.map
            .pio/build/freenove_stockfish_compile/firmware.bin
            .pio/build/freenove_stockfish_compile/firmware.map
            .pio/build/freenove_stockfish_nnubench/firmware.bin
            .pio/build/freenove_stockfish_nnubench/firmware.map
            .pio/build/freenove_stockfish_nnubench/firmware.elf
            .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.bin
            .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.map
            .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.elf
            .pio/build/freenove_stockfish_nnubench_fc0pie/firmware.disasm
            .pio/build/freenove_stockfish_pievalidate/firmware.bin
            .pio/build/freenove_stockfish_pievalidate/firmware.map
          if-no-files-found: warn
          retention-days: 7
