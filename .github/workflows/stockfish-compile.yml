name: ESP32-S3 Stockfish Smallnet compile

on:
  push:
    branches:
      - stockfish-port-analysis
    paths:
      - "platformio.ini"
      - "src/**"
      - ".github/workflows/stockfish-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile Stockfish 19 Smallnet for ESP32-S3
        run: pio run -e freenove_stockfish_compile

      - name: Upload linker map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stockfish-s3-linker-map
          path: .pio/build/freenove_stockfish_compile/firmware.map
          if-no-files-found: warn
          retention-days: 7
